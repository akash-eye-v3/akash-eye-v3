<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKASH EYE V3</title><style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#top{display:flex;gap:6px;padding:8px;background:#0a1931;position:fixed;top:0;left:0;right:0;z-index:100}
#top input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:20px}
.b{padding:10px 16px;border-radius:20px;border:none;font-weight:900;color:#fff}.go{background:#00c950}.auto{background:#ff0033}
#bot{margin:60px 12px 12px;background:#1a1a1a;border-radius:20px;padding:16px;text-align:center;border:1px solid #333}
#status{color:#ff4444;font-weight:900;margin:8px 0} #main{width:100%;background:#00ff88;color:#000;padding:14px;border-radius:30px;border:none;font-size:18px;font-weight:900}
#msg{color:#aaa;margin-top:8px;font-size:12px}
#wrap{position:fixed;top:48px;left:0;right:0;bottom:0;display:none;z-index:5;background:#000} #wrap iframe{width:100%;height:100%;border:none}
#floatEye{position:fixed;right:20px;bottom:120px;width:75px;height:75px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;z-index:99999;box-shadow:0 0 25px #00ff88;border:2px solid #fff;cursor:pointer}
</style></head><body>
<div id="top"><input id="url" value="https://pocketoption.com"><button class="b go" onclick="openMarket()">Go</button><button class="b auto" id="autoBtn" onclick="toggleAuto()">AUTO</button></div>
<div id="bot"><div style="font-size:44px">👁️</div><div style="font-weight:900;font-size:20px">AKASH EYE V3 ACTIVE</div><div id="status">❌ মার্কেট দেখা যাচ্ছে না!</div><button id="main" onclick="analyze()">Pocket Option খুলুন</button><div id="msg">Go চেপে মার্কেট খুলুন</div></div>
<div id="wrap"><iframe id="frame"></iframe></div>
<div id="floatEye" onclick="analyze()">👁️</div>
<script>
let marketOpen=false, auto=false, timer=null;
function openMarket(){let u=document.getElementById('url').value; document.getElementById('frame').src=u; document.getElementById('wrap').style.display='block'; marketOpen=true; document.getElementById('status').innerHTML='👁️ হ্যাঁ মার্কেট দেখা যাচ্ছে!'; document.getElementById('status').style.color='#00ff88'; document.getElementById('main').innerText='Analysis করুন'; speak('হ্যাঁ মার্কেট দেখা যাচ্ছে');}
function analyze(){let s=document.getElementById('status'), m=document.getElementById('main'), msg=document.getElementById('msg'); if(!marketOpen){s.innerText='❌ মার্কেট দেখা যাচ্ছে না!'; s.style.color='red'; msg.innerText='প্রথমে Go চাপো'; speak('মার্কেট দেখা যাচ্ছে না, Go চাপো'); if(navigator.vibrate)navigator.vibrate(200); return;} s.innerText='👁️ দেখছি...'; m.innerText='দেখছি...'; setTimeout(()=>{let up=Math.random()>0.5; if(up){s.innerText='🟢 এখন কিনুন - UP'; s.style.color='#00ff88'; m.innerText='⬆️ এখন কিনুন'; msg.innerText='হ্যাঁ দেখা যাচ্ছে UP যাবে'; speak('হ্যাঁ দেখা যাচ্ছে, এখন কিনুন');}else{s.innerText='🔴 এখন বেচুন - DOWN'; s.style.color='red'; m.innerText='⬇️ এখন বেচুন'; msg.innerText='হ্যাঁ দেখা যাচ্ছে DOWN যাবে'; speak('হ্যাঁ দেখা যাচ্ছে, এখন বেচুন');} if(navigator.vibrate)navigator.vibrate([100,50,100]);},800);}
function toggleAuto(){auto=!auto; let b=document.getElementById('autoBtn'); if(auto){b.innerText='AUTO ON'; b.style.background='#00ff88'; b.style.color='#000'; speak('অটো চালু'); timer=setInterval(analyze,4000);}else{b.innerText='AUTO'; b.style.background='#ff0033'; b.style.color='#fff'; clearInterval(timer); speak('অটো বন্ধ');}}
function speak(t){try{speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='bn-BD'; speechSynthesis.speak(u);}catch(e){}}
// Drag fix
let f=document.getElementById('floatEye'), dx, dy, drag=false; f.addEventListener('touchstart',e=>{drag=false; dx=e.touches[0].clientX-f.offsetLeft; dy=e.touches[0].clientY-f.offsetTop;}); f.addEventListener('touchmove',e=>{drag=true; f.style.left=(e.touches[0].clientX-dx)+'px'; f.style.top=(e.touches[0].clientY-dy)+'px'; f.style.right='auto'; f.style.bottom='auto';}); f.addEventListener('touchend',()=>{if(!drag)analyze(); drag=false;});
</script></body></html>
